<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASIKAW Live Classroom</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

header {
  background: #172554;
  padding: 22px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
}

.class-card {
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

.video-box {
  background: #0f172a;
  min-height: 260px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px 0;
  border: 1px solid #334155;
}

button {
  background: #2563eb;
  color: white;
  padding: 14px 25px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

button:disabled {
  background: #475569;
}

.info {
  color: #cbd5e1;
  line-height: 1.8;
}

</style>
</head>

<body>

<header>
  <h1>FASIKAW TECH</h1>
  <p>Online Learning Classroom</p>
</header>

<div class="container">
  <div class="class-card">

    <h2>Live Video Classroom</h2>

    <p class="info">
      Computer Basics - Grade 9 & 10
    </p>

    <div class="video-box">
      <p>Live Video Session Will Appear Here</p>
    </div>

    <button disabled>
      Waiting for Secure Meeting Setup
    </button>

    <p class="info">
      Welcome to FASIKAW Online Classroom.
      Your teacher will provide an authorized
      meeting invitation.
    </p>

  </div>
</div>

</body>
</html>
